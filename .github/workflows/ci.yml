name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Portable flake checks (x86_64)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}

      - name: Evaluate every flake output
        run: nix flake check --all-systems --no-build --print-build-logs

      - name: Check Python dependency alignment
        run: nix run .#update-python-deps -- --check

      - name: Build portable checks
        run: nix flake check --print-build-logs

  native-tests:
    name: Native flake checks (aarch64)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}

      - name: Build native checks
        run: nix flake check --print-build-logs
