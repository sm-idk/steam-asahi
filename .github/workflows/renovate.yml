name: Renovate

on:
  schedule:
    - cron: "17 4 * * 1-5"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Update dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the Renovate token
        # Use a bot PAT with repository write and workflow write access. The
        # built-in GITHUB_TOKEN cannot trigger CI for Renovate's branch pushes.
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [[ -z "$RENOVATE_TOKEN" ]]; then
            echo '::error::Add a RENOVATE_TOKEN repository secret.'
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          # renovate: datasource=github-releases depName=renovatebot/renovate
          renovate-version: 44.128.2
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_ONBOARDING: "false"
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REQUIRE_CONFIG: required
