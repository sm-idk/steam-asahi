name: Renovate

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Update dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the Renovate token
        # Use a PAT with Contents and Workflows write permissions so branch
        # pushes trigger CI; keep Issues and Pull requests read-only
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [[ -z "$RENOVATE_TOKEN" ]]; then
            echo '::error::Add a RENOVATE_TOKEN repository secret.'
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          renovate-version: 44.148.4
          token: ${{ secrets.RENOVATE_TOKEN }}
          docker-cmd-file: .github/renovate.sh
        env:
          LOG_LEVEL: info
          RENOVATE_ONBOARDING: "false"
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REQUIRE_CONFIG: required
