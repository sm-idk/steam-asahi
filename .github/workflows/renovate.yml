name: Renovate

on:
  schedule:
    - cron: "17 4 * * 1-5"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Update dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Require the Renovate token
        # Use a bot PAT with repository write and workflow write access. The
        # built-in GITHUB_TOKEN cannot trigger CI for Renovate's branch pushes.
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [[ -z "$RENOVATE_TOKEN" ]]; then
            echo '::error::Add a RENOVATE_TOKEN repository secret.'
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@22e0a16091fc706b04affe6ae53d5e3358ac4023 # v46.1.19
        with:
          # renovate: datasource=github-releases depName=renovatebot/renovate
          renovate-version: 43.260.3
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_ONBOARDING: "false"
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REQUIRE_CONFIG: required
