[project]
name = "steam-asahi"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = [
  "boltons>=25,<27",
  "msgspec>=0.21.1,<0.23",
  "vdf>=3.4,<4",
]

[dependency-groups]
dev = [
  "ruff>=0.16.10,<0.17",
  "ty>=0.0.85,<0.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 80
target-version = "py314"
extend-exclude = [".direnv", "downloads"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The import check captures the environment before loading launcher modules
"pkgs/steam-asahi-arm64/tests/check-launcher-imports.py" = ["E402"]

[tool.ty.environment]
python-version = "3.14"
python-platform = "linux"
extra-paths = ["pkgs/scripts/launcher"]

[tool.ty.src]
exclude = [".direnv", "downloads"]
